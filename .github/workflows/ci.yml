name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: lint, types and unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install espeak-ng
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov --cov-report=term

  integration:
    name: integration tests with the real model
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install espeak-ng
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-wav2vec2-lv-60-espeak-cv-ft-v1
      - run: pytest -m integration -v
        env:
          ENUNCIATE_DEVICE: cpu

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build without the model baked in
        run: docker build --build-arg PRELOAD_MODEL=0 -t enunciate:ci .
      - name: Smoke test the image
        run: |
          docker run --rm enunciate:ci enunciate phonemes "I love India"
          docker run --rm enunciate:ci enunciate --version
